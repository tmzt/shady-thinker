[package]
name = "shady-thinker"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "shady_thinker"

[features]
default = []
chat = []
jit-lora = ["chat"]
# Enable <think> token injection before decode (reasoning models).
# Disabled by default — fast inference doesn't use it.
think-injection = []
# Gates integration tests that need a real GPU + model weights on
# disk. Same convention the workspace uses (see Makefile
# `cargo test --features gpu-test ...` invocations for fast/deep
# thinker engine tests).
gpu-test = []

[[example]]
name = "chat"
required-features = ["jit-lora"]

[[test]]
name = "jit_lora_test"
path = "tests/integration/jit_lora_test.rs"
required-features = ["jit-lora"]

[[test]]
name = "continuation_prefill_eq"
path = "tests/integration/continuation_prefill_eq.rs"
required-features = ["gpu-test"]

[dependencies]
wgpu = { version = "29", features = ["vulkan"] }
pollster = "0.4"
safetensors = "0.4"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
common = { path = "../../common" }
# Used solely for the optional streaming sink type on GpuContext —
# matches smol::channel::Sender (which is pub use async_channel) so
# senders cross the crate boundary without conversion.
async-channel = "2"
libc = "0.2"
memmap2 = "0.9"

# `common` (path dep above) depends on `network_transport` /
# `network_mux` via crates.io version specifiers, but those crates
# only exist inside this repo. The top-level workspace patches them
# via `[patch.crates-io]`, but shady-thinker is `exclude`d from the
# workspace so it doesn't inherit that patch — we have to repeat it
# here for `cargo test`/`cargo build` from this directory to resolve.
[patch.crates-io]
network_transport = { path = "../chitin_connect_rs/deps/chitin_public/network_transport" }
network_mux = { path = "../chitin_connect_rs/deps/chitin_public/network_mux" }
